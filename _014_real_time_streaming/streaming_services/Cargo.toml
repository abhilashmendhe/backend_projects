[package]
name = "streaming_services"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ingestion_service"
path = "src/ingestion_service/main.rs"

[[bin]]
name = "stream_queue"
path = "src/stream_queue/main.rs"


[dependencies]
actix-web = "4.14.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dotenv = "0.15.0"
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-native-tls", "chrono", "macros", "bigdecimal"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
