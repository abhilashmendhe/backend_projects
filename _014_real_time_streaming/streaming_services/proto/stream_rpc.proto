syntax = "proto3";

package stream_service;

import "google/protobuf/timestamp.proto";

service MessageStream {
    rpc Publish(PublishRequest) returns (PublishResponse);
}

message PublishRequest {
    string message_id = 1;
    bytes payload = 2;
    int64 timestamp = 3;
}

message PublishResponse {
    string message_id = 1;
    bool accepted = 2;
    string message = 3;
}

message Event {
    string device_id = 1;
    string room_id = 2;
    EventType event_type = 3;
    google.protobuf.Timestamp ts = 4;
    uint64 seq = 5;

    optional bool in_room = 6;
    optional float magnitude = 7;
    optional SleepState state = 8;
    optional float confidence = 9;
    optional int32 rssi = 10;
}

enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    HEARTBEAT = 1;
    PRESENCE = 2;
    MOTION = 3;
    SLEEP_STATE = 4;
    FALL_WARN = 5;
    NET_STATUS = 6;
}


enum SleepState {
    SLEEP_STATE_UNSPECIFIED = 0;
    ASLEEP = 1;
    AWAKE = 2;
    UNKNOWN = 3;
}